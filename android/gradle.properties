# If Gradle fails with "Could not GET ... dl.google.com" / "nodename nor servname provided",
# fix DNS or use a network where google maven is reachable. Aliyun mirrors are listed in
# settings.gradle.kts and build.gradle as fallbacks.
#
# JBR 17.0.14: Android Studio's bundled 17.0.9 crashes the Gradle daemon on
# Apple Silicon (assembler_aarch64 "Field too big for insn") during release.
org.gradle.java.home=/Users/apple/Library/Java/JavaVirtualMachines/jbr-17.0.14/Contents/Home
# -XX:-TieredCompilation disables the C1 JIT that hits that JDK bug.
# Keep the heap modest: 16GB Mac + Flutter/emulator.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:-TieredCompilation -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
