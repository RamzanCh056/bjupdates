# If Gradle fails with "Could not GET ... dl.google.com" / "nodename nor servname provided",
# fix DNS or use a network where google maven is reachable. Aliyun mirrors are listed in
# settings.gradle.kts and build.gradle as fallbacks.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2G -XX:TieredStopAtLevel=1
android.useAndroidX=true
android.enableJetifier=true
